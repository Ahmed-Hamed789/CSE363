<svg viewBox="0 0 1240 860" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Browser reaches the ALB in the VPC's public subnets over HTTP port 80; the ALB forwards to an Nginx container in the app subnet, which routes synchronously to the Document Service on port 5001 and the Quiz Service on port 5002. Both services reach RDS in the private DB subnet over TCP 5432. Outside the VPC, the Document Service writes to the documents S3 bucket and sends an async SQS message; the Quiz Service polls that queue, writes to the quizzes S3 bucket, and publishes an async SNS notification that reaches a subscribed email. The browser also loads the static frontend directly from a separate public S3 bucket.">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b7a94"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5732a"/>
    </marker>
  </defs>

  <rect width="1240" height="860" fill="#ffffff"/>

  <g font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" fill="#1b1d22">

    <!-- VPC boundary -->
    <rect x="150" y="50" width="760" height="730" rx="10" fill="none" stroke="#1b1d22" stroke-width="1.6" stroke-dasharray="7 4"/>
    <text x="164" y="76" font-size="13" font-weight="700">VPC &#183; cse363-vpc &#183; 10.0.0.0/16</text>

    <!-- Tier: public -->
    <rect x="170" y="92" width="720" height="130" rx="6" fill="#f3f2ee" stroke="#d8d5cc"/>
    <text x="182" y="110" font-size="10.5" fill="#6b6f7a">PUBLIC SUBNETS &#8212; us-east-1a / us-east-1b</text>
    <rect x="380" y="126" width="160" height="66" rx="6" fill="#eaf3f6" stroke="#2b7a94" stroke-width="1.4"/>
    <text x="460" y="154" text-anchor="middle" font-size="12" font-weight="700">ALB</text>
    <text x="460" y="170" text-anchor="middle" font-size="9.5" fill="#4a4f5b">cse363-alb</text>

    <!-- Tier: app -->
    <rect x="170" y="240" width="720" height="230" rx="6" fill="#f3f2ee" stroke="#d8d5cc"/>
    <text x="182" y="258" font-size="10.5" fill="#6b6f7a">APP SUBNET &#8212; us-east-1a (cse363-app-a)</text>
    <rect x="200" y="272" width="660" height="180" rx="6" fill="#ffffff" stroke="#1b1d22" stroke-width="1.2"/>
    <text x="215" y="292" font-size="10.5" font-weight="700">EC2 &#183; cse363-app-1 (t3.micro)</text>

    <rect x="225" y="308" width="140" height="70" rx="5" fill="#ffffff" stroke="#1b1d22"/>
    <text x="295" y="338" text-anchor="middle" font-size="11.5" font-weight="700">Nginx</text>
    <text x="295" y="353" text-anchor="middle" font-size="9" fill="#6b6f7a">:80 gateway</text>

    <rect x="420" y="308" width="180" height="70" rx="5" fill="#eaf3f6" stroke="#2b7a94" stroke-width="1.2"/>
    <text x="510" y="335" text-anchor="middle" font-size="11" font-weight="700">Document Service</text>
    <text x="510" y="350" text-anchor="middle" font-size="9" fill="#6b6f7a">:5001</text>

    <rect x="645" y="308" width="180" height="70" rx="5" fill="#eaf3f6" stroke="#2b7a94" stroke-width="1.2"/>
    <text x="735" y="335" text-anchor="middle" font-size="11" font-weight="700">Quiz Service</text>
    <text x="735" y="350" text-anchor="middle" font-size="9" fill="#6b6f7a">:5002 + SQS worker</text>

    <line x1="365" y1="335" x2="418" y2="322" stroke="#2b7a94" marker-end="url(#a1)"/>
    <text x="368" y="316" font-size="9" fill="#2b7a94">HTTP:5001 sync</text>
    <polyline points="295,378 295,400 735,400 735,376" fill="none" stroke="#2b7a94" marker-end="url(#a1)"/>
    <text x="430" y="414" font-size="9" fill="#2b7a94">HTTP:5002 sync</text>

    <!-- Tier: db -->
    <rect x="170" y="486" width="720" height="130" rx="6" fill="#f3f2ee" stroke="#d8d5cc"/>
    <text x="182" y="504" font-size="10.5" fill="#6b6f7a">DB SUBNETS &#8212; us-east-1a / us-east-1b &#8212; no internet route</text>
    <rect x="400" y="520" width="220" height="76" rx="6" fill="#eaf3f6" stroke="#2b7a94" stroke-width="1.4"/>
    <text x="510" y="548" text-anchor="middle" font-size="11.5" font-weight="700">RDS &#183; cse363-postgres</text>
    <text x="510" y="564" text-anchor="middle" font-size="9.5" fill="#4a4f5b">docs_db &#183; quiz_db</text>
    <text x="510" y="580" text-anchor="middle" font-size="9" fill="#6b6f7a">private, single-AZ</text>

    <!-- ALB down to nginx -->
    <line x1="460" y1="192" x2="460" y2="306" stroke="#2b7a94" marker-end="url(#a1)"/>
    <text x="466" y="230" font-size="9" fill="#2b7a94">HTTP:80 sync</text>

    <!-- services down to RDS -->
    <line x1="510" y1="378" x2="510" y2="518" stroke="#2b7a94" marker-end="url(#a1)"/>
    <text x="440" y="452" font-size="9" fill="#2b7a94">TCP:5432 sync</text>
    <line x1="735" y1="404" x2="600" y2="518" stroke="#2b7a94" marker-end="url(#a1)"/>
    <text x="620" y="494" font-size="9" fill="#2b7a94">TCP:5432 sync</text>

    <!-- Browser -->
    <rect x="20" y="126" width="110" height="60" rx="6" fill="none" stroke="#1b1d22"/>
    <text x="75" y="152" text-anchor="middle" font-size="11.5" font-weight="700">Browser</text>
    <text x="75" y="167" text-anchor="middle" font-size="9" fill="#6b6f7a">the user</text>
    <line x1="130" y1="156" x2="378" y2="156" stroke="#2b7a94" marker-end="url(#a1)"/>
    <text x="150" y="148" font-size="9" fill="#2b7a94">HTTP:80 sync (API calls)</text>

    <!-- external regional services -->
    <rect x="960" y="180" width="220" height="50" rx="6" fill="none" stroke="#1b1d22"/>
    <text x="1070" y="200" text-anchor="middle" font-size="11">S3 &#183; cse363-frontend</text>
    <text x="1070" y="215" text-anchor="middle" font-size="9" fill="#6b6f7a">public, static site</text>
    <line x1="75" y1="126" x2="75" y2="70" stroke="#2b7a94"/>
    <line x1="75" y1="70" x2="958" y2="70" stroke="#2b7a94" marker-end="url(#a1)"/>
    <line x1="958" y1="70" x2="958" y2="205" stroke="#2b7a94" marker-end="url(#a1)"/>
    <text x="500" y="64" font-size="9" fill="#2b7a94">HTTPS:443 sync &#8212; page load, not through the ALB</text>

    <rect x="960" y="300" width="220" height="50" rx="6" fill="none" stroke="#1b1d22"/>
    <text x="1070" y="320" text-anchor="middle" font-size="11">S3 &#183; cse363-documents</text>
    <text x="1070" y="335" text-anchor="middle" font-size="9" fill="#6b6f7a">the file itself</text>
    <polyline points="600,315 600,285 958,285 958,315" fill="none" stroke="#2b7a94" marker-end="url(#a1)"/>
    <text x="630" y="279" font-size="9" fill="#2b7a94">HTTPS:443 sync</text>

    <rect x="960" y="400" width="220" height="50" rx="6" fill="none" stroke="#b5732a" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="1070" y="420" text-anchor="middle" font-size="11" font-weight="700">SQS &#183; document-processing</text>
    <text x="1070" y="435" text-anchor="middle" font-size="9" fill="#6b6f7a">{document_id, text}</text>
    <line x1="600" y1="360" x2="1030" y2="398" stroke="#b5732a" stroke-dasharray="5 4" marker-end="url(#a2)"/>
    <text x="700" y="404" font-size="9" fill="#8a5a1e">HTTPS:443 async &#183; SendMessage</text>
    <line x1="1000" y1="450" x2="815" y2="380" stroke="#b5732a" stroke-dasharray="5 4" marker-end="url(#a2)"/>
    <text x="895" y="445" font-size="9" fill="#8a5a1e">poll every ~20s &#183; async</text>

    <rect x="960" y="500" width="220" height="50" rx="6" fill="none" stroke="#1b1d22"/>
    <text x="1070" y="520" text-anchor="middle" font-size="11">S3 &#183; cse363-quizzes</text>
    <text x="1070" y="535" text-anchor="middle" font-size="9" fill="#6b6f7a">quiz JSON</text>
    <polyline points="825,340 900,340 900,510 958,520" fill="none" stroke="#2b7a94" marker-end="url(#a1)"/>
    <text x="905" y="440" font-size="9" fill="#2b7a94">HTTPS:443 sync</text>

    <rect x="960" y="620" width="220" height="50" rx="6" fill="none" stroke="#b5732a" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="1070" y="640" text-anchor="middle" font-size="11" font-weight="700">SNS &#183; quiz-ready</text>
    <text x="1070" y="655" text-anchor="middle" font-size="9" fill="#6b6f7a">one sub per member</text>
    <polyline points="825,360 940,360 940,645 958,645" fill="none" stroke="#b5732a" stroke-dasharray="5 4" marker-end="url(#a2)"/>
    <text x="945" y="580" font-size="9" fill="#8a5a1e">HTTPS:443 async &#183; Publish</text>

    <rect x="1000" y="690" width="150" height="46" rx="6" fill="none" stroke="#b5732a" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="1075" y="712" text-anchor="middle" font-size="11" font-weight="700">Email</text>
    <text x="1075" y="726" text-anchor="middle" font-size="9" fill="#6b6f7a">team inbox</text>
    <line x1="1070" y1="670" x2="1075" y2="688" stroke="#b5732a" stroke-dasharray="5 4" marker-end="url(#a2)"/>

  </g>
</svg>
