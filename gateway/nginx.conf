server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Docker's embedded DNS. Without this, nginx resolves upstream hostnames
    # once at worker startup and caches the IP forever -- so rebuilding just
    # document-service or quiz-service (without touching this container)
    # leaves nginx pointed at a dead IP and every request 502s until gateway
    # itself is restarted. Resolving through a variable, with a short TTL,
    # makes it re-resolve on its own.
    resolver 127.0.0.11 valid=10s;

    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    # The frontend is served from the cse363-frontend S3 bucket — a
    # different origin from this ALB — so every /api/ response needs CORS
    # headers, and preflight OPTIONS requests need to be answered directly.
    location /api/documents {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) {
            return 204;
        }

        set $upstream_document http://document-service:5001;
        proxy_pass $upstream_document;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/quiz {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) {
            return 204;
        }

        set $upstream_quiz http://quiz-service:5002;
        proxy_pass $upstream_quiz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404 "not found\n";
    }
}
